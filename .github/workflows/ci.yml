name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Rulesets are PINNED, never `--config auto`: auto resolves the
      # registry at run time, so a green main can go red with no code
      # change - disqualifying for a required check.
      - run: >
          semgrep scan --error
          --config p/python
          --config p/javascript
          --config p/secrets

  # Deliberately NOT a required branch-protection context: wiring a linter
  # into a protected repo via a required job would turn main red the moment
  # it lands. This job measures the debt; it gates nothing until the debt is
  # paid and the owner promotes it.
  lint:
    name: Ruff lint (non-gating)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install ruff
        run: python -m pip install --quiet ruff==0.9.2
      # MUTE BUTTON, NOT A FIX (2026-08-20), scoped to THIS STEP ONLY so
      # checkout and install failures stay loud (CodeRabbit, PR #16). It
      # silences the 11 known ruff findings. Exit condition: fix the 11,
      # then delete this step-level flag. Never promote this job to a
      # required context while any mute exists.
      - name: Ruff check (debt meter)
        continue-on-error: true
        run: ruff check .
